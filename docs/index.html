<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juzni Vetar Raids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono&display=swap">
<style>
/* One column: the copy button is the page's job, raid cards underneath for checking */
:root {
  --bg: #12151b; --panel: #1b2029; --panel2: #232a35; --fg: #e9e4d8; --muted: #9aa0a8; --line: #2f3742;
  --gold: #e2b44a; --gold-ink: #1a1408; --ok: #6cc47a; --warn: #f0b04a; --bad: #ef7a68;
  --display: "Cinzel", Georgia, serif; --body: "Source Sans 3", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f2f0ea; --panel: #ffffff; --panel2: #f6f3ec; --fg: #1f1c17; --muted: #6b665d; --line: #ddd7ca;
    --gold: #93650c; --gold-ink: #ffffff; --ok: #2e7d3a; --warn: #9a6200; --bad: #b23a2a; color-scheme: light; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
h1 { margin: 0; font: 700 clamp(28px, 6vw, 38px)/1.1 var(--display); color: var(--gold); letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 14px; }
.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 12px; }
.big { font: 700 18px var(--body); padding: 14px 20px; border-radius: 6px; border: 0; background: var(--gold); color: var(--gold-ink); cursor: pointer; width: 100%; }
.big:disabled { opacity: .45; cursor: default; }
.steps { margin: 0; color: var(--muted); font-size: 14px; }
.steps b { color: var(--fg); }
.msg { min-height: 1.4em; font-size: 14px; color: var(--ok); margin: 0; }
.raid { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.raid h2 { margin: 0; font: 600 20px/1.2 var(--display); }
.when { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.soon { color: var(--warn); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 14px var(--body); padding: 7px 14px; border-radius: 5px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; text-decoration: none; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 12px; margin-top: 8px; font-size: 14px; }
.roster span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-L { color: var(--warn); } .st-T, .st-B { color: var(--muted); } .st-N { color: var(--bad); text-decoration: line-through; }
.c-WARRIOR{color:#c69b6d}.c-PALADIN{color:#f48cba}.c-HUNTER{color:#aad372}.c-ROGUE{color:#e8d55c}.c-PRIEST{color:var(--fg)}
.c-DEATHKNIGHT{color:#c41e3a}.c-SHAMAN{color:#2a8ef5}.c-MAGE{color:#3fc7eb}.c-WARLOCK{color:#8788ee}.c-DRUID{color:#ff7c0a}
@media (prefers-color-scheme: light) { .c-ROGUE{color:#9a8a00}.c-MAGE{color:#1a8fb0}.c-HUNTER{color:#5f8f2a} }
.empty { color: var(--muted); text-align: center; padding: 24px; }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
footer a { color: var(--gold); }
.problems { color: var(--bad); font-size: 13px; white-space: pre-wrap; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
textarea.hidden { position: fixed; left: -9999px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Juzni Vetar Raids</h1>
    <div class="sub" id="updated">Loading…</div>
  </header>

  <section class="hero">
    <button class="big" id="copyAll" disabled>Copy all raids</button>
    <p class="msg" id="msg"></p>
    <p class="steps">Then in game: <b>/gr</b> → <b>Import</b> → <b>Ctrl+V</b> → <b>Import</b>. Everyone online with the addon gets the raids.</p>
  </section>

  <main id="raids"></main>

  <footer>
    <div>Raids refresh from Raid-Helper every 30 minutes. <a id="runNow" href="#" target="_blank" rel="noopener">Update now</a> (on GitHub, click "Run workflow").</div>
    <div class="problems" id="problems"></div>
  </footer>
</div>
<textarea class="hidden" id="buf" aria-hidden="true" tabindex="-1"></textarea>

<script>
const $ = id => document.getElementById(id);
const ROLE = { T: "Tank", H: "Healer", D: "DPS" };
const STATUS_NOTE = { L: " (late)", T: " (tentative)", B: " (bench)", N: "" };
let data = null;

// GitHub links for "Update now"
(function () {
  const owner = location.hostname.split(".")[0];
  const repo = location.pathname.split("/").filter(Boolean)[0];
  if (location.hostname.endsWith("github.io") && repo) {
    $("runNow").href = `https://github.com/${owner}/${repo}/actions/workflows/update.yml`;
  } else { $("runNow").removeAttribute("href"); }
})();

function ago(iso) {
  if (!iso) return "never";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " days ago";
}
function fmt(ts) {
  return new Date(ts * 1000).toLocaleString(undefined, { weekday: "long", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function until(ts) {
  const s = ts - Date.now() / 1000;
  if (s < 0) return '<span class="soon">started</span>';
  if (s < 3 * 3600) return `<span class="soon">in ${Math.max(1, Math.round(s / 60))} min</span>`;
  if (s < 86400) return `in ${Math.round(s / 3600)} h`;
  return `in ${Math.round(s / 86400)} days`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch { const b = $("buf"); b.value = text; b.select(); document.execCommand("copy"); }
  $("msg").textContent = `Copied ${label}. Paste it in game with Ctrl+V.`;
}

function render() {
  const raids = (data.raids || []).filter(r => r.start > Date.now() / 1000 - 6 * 3600);
  $("updated").textContent = `${raids.length} upcoming raid${raids.length === 1 ? "" : "s"} · last change ${ago(data.updated)}`;
  const all = raids.map(r => r.import).join("\n");
  $("copyAll").disabled = !all;
  $("copyAll").textContent = raids.length ? `Copy all raids (${raids.length})` : "No raids to copy";
  $("copyAll").onclick = () => copy(all, raids.length === 1 ? "1 raid" : `${raids.length} raids`);

  $("raids").innerHTML = raids.length ? "" : '<div class="empty">No upcoming Raid-Helper events yet.</div>';
  raids.forEach((r, i) => {
    const c = r.counts;
    const order = { T: 0, H: 1, D: 2 }, sOrder = { Y: 0, L: 1, T: 2, B: 3, N: 4 };
    const people = [...r.signups].sort((a, b) => (sOrder[a.status] - sOrder[b.status]) || (order[a.role] - order[b.role]) || a.name.localeCompare(b.name));
    const el = document.createElement("article");
    el.className = "raid";
    el.innerHTML = `
      <h2>${esc(r.title)}</h2>
      <div class="when">${esc(fmt(r.start))} · ${until(r.start)}${r.leader ? " · led by " + esc(r.leader) : ""}</div>
      <div class="pills">
        <span class="pill">${c.signed}/${r.size} signed</span>
        <span class="pill">${c.tanks} tanks</span><span class="pill">${c.healers} healers</span>
        <span class="pill">${c.signed - c.tanks - c.healers} dps</span>
        ${c.late ? `<span class="pill">${c.late} late</span>` : ""}${c.tentative ? `<span class="pill">${c.tentative} tentative</span>` : ""}
        ${c.bench ? `<span class="pill">${c.bench} bench</span>` : ""}${c.declined ? `<span class="pill">${c.declined} declined</span>` : ""}
      </div>
      <div class="row">
        <button class="btn" type="button" data-i="${i}">Copy this raid</button>
        ${r.link ? `<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">Open in Discord</a>` : ""}
      </div>
      <details><summary>Signups (${r.signups.length})</summary>
        <div class="roster">${people.map(p => `<span class="st-${p.status}"><span class="c-${p.cls}">${esc(p.name)}</span> · ${ROLE[p.role]}${STATUS_NOTE[p.status] || ""}${p.status === "N" ? " (declined)" : ""}</span>`).join("")}</div>
      </details>`;
    el.querySelector("button").onclick = () => copy(r.import, r.title);
    $("raids").appendChild(el);
  });
  $("problems").textContent = (data.problems || []).length ? "Some events couldn't be read:\n" + data.problems.join("\n") : "";
}

fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.json())
  .then(d => { data = d; render(); setInterval(render, 60000); })
  .catch(() => { $("updated").textContent = "Couldn't load raid data. Try again in a minute."; });
</script>
</body>
</html>
